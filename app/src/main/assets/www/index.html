<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a6f">
  <title>Cruise Deals</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="top">
    <button id="back" class="icon-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z" fill="currentColor"/></svg>
    </button>
    <div class="titles">
      <h1 id="title">Cruise Deals</h1>
      <div id="subtitle"></div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabs" aria-label="Main">
    <button data-root="explore" class="active"><span class="ti">&#9875;</span><span>Explore</span></button>
    <button data-root="alerts"><span class="ti">&#128276;</span><span>Alerts</span><b id="alertBadge" hidden></b></button>
    <button data-root="mycruises"><span class="ti">&#128188;</span><span>My Cruises</span></button>
    <button data-root="settings"><span class="ti">&#9881;</span><span>Settings</span></button>
  </nav>

  <div id="sheetBackdrop" hidden></div>
  <section id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="platform.js"></script>
  <script src="app.js"></script>
</body>
</html>
